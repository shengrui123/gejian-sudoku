<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#255b46"><meta name="description" content="一格一格，找回專注。免費繁體中文數獨遊戲，提供經典與殺手數獨、每日挑戰、三種難度、筆記、提示與自動存檔。"><title>格間 Sudoku — 留一點時間，給自己</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head>
<body><header class="header"><a class="brand" href="./"><span class="brand-icon">▦</span>格間<span class="brand-en">SUDOKU</span></a><div class="header-right"><span class="calm">慢下來，想清楚。</span><button id="help" class="icon-button" aria-label="遊戲說明">?</button></div></header>
<main><section class="intro"><div><div class="eyebrow"><span></span> A LITTLE FOCUS, EVERY DAY</div><h1>留一點時間，<em>給自己。</em></h1><p>把紛亂留在外面，在九宮格裡找回自己的節奏。</p></div><div class="edition">THE DAILY PAUSE<span>01 — 81</span></div></section>
<div class="workspace"><section class="game-card" aria-label="數獨遊戲"><div class="mode-switch" role="group" aria-label="遊戲模式"><button data-mode="classic" class="active" aria-pressed="true">▦ 經典數獨</button><button data-mode="killer" aria-pressed="false">▧ 殺手數獨</button></div><p id="killer-info" class="killer-info" role="status" hidden></p><div class="game-top"><div class="difficulty"><button data-level="easy" class="active">簡單</button><button data-level="medium">中等</button><button data-level="hard">困難</button></div><span id="mode-label" class="mode-label">自由練習</span></div><div class="game-meta"><div><span id="level-name">簡單</span><span class="meta-dot">·</span><span id="mistakes">錯誤 0</span></div><div class="timer"><span>◷</span><time id="timer">00:00</time><button id="pause" class="pause" aria-label="暫停遊戲">Ⅱ</button></div></div>
<div class="board-wrap"><div id="board" role="grid" aria-label="數獨棋盤"></div><div id="pause-overlay" class="pause-overlay" hidden><span>留白，也是一種進度。</span><button id="resume" class="primary">繼續遊戲 →</button></div></div>
<div class="board-bottom"><span><i></i> 自動儲存進度</span><span id="progress-text">已填入 0 / 0 格</span></div><div class="progress"><div id="progress-bar"></div></div></section>
<aside><div class="play-panel"><div class="panel-heading"><span>你的下一步</span><span class="tiny-grid">▦</span></div><p class="panel-description">選一個空格，讓思緒慢慢清晰。</p><div class="tools"><button id="undo"><span>↶</span>復原</button><button id="erase"><span>⌫</span>擦除</button><button id="notes" aria-pressed="false"><span>✎</span>筆記<small id="note-state">關</small></button><button id="hint"><span>☼</span>提示<small id="hint-count">3</small></button></div><div id="numpad" class="numpad" aria-label="數字鍵盤"></div><p class="keyboard-tip">也可以使用鍵盤 1–9 輸入數字</p><button id="new-game" class="primary new-game"><span>＋</span> 開始新遊戲 <span>↗</span></button></div>
<button id="daily" class="daily-card"><div class="daily-top"><span class="daily-icon">☀</span><span class="tag">每日一題</span><span class="arrow">↗</span></div><h2>今天，也為自己解一題。</h2><p id="daily-date"></p><div class="daily-footer"><span>接受今日挑戰</span><span>→</span></div></button>
<div class="quote"><span>“</span><p>不必急著填滿每一格。<br>下一個答案，會在專注中出現。</p><div>ONE CELL AT A TIME.</div></div></aside></div>
<footer><span>格間 <span class="footer-dot">·</span> 專注的片刻，剛剛好。</span><button id="rules">第一次玩數獨？</button><span class="footer-note">MADE FOR A QUIETER MIND</span></footer></main>
<div id="toast" role="status" hidden></div><dialog id="dialog"><button id="close-dialog" class="close" aria-label="關閉">×</button><div id="dialog-body"></div></dialog><script type="module" src="app.js"></script></body></html>
